<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fantasy Stats</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Top Header Navigation -->
    <header class="navbar">
      <div class="nav-left">
        <span class="logo">FANTASY STATS</span>
      </div>

      <nav class="nav-center">
        <button class="nav-link active" data-tab="history">History</button>
        <button class="nav-link" data-tab="live">Live</button>
        <button class="nav-link" data-tab="import">Import</button>
      </nav>

      <div class="nav-right">
        <div class="status-indicator-wrap" id="ws-status-wrap" title="Live Stream Status">
          <span class="status-dot" id="ws-dot"></span>
          <span class="status-label" id="ws-status-text">Connecting</span>
        </div>
      </div>
    </header>

    <main class="content">
      <!-- 1. History View -->
      <section id="tab-history" class="view-panel active">
        <!-- Control Bar -->
        <div class="toolbar">
          <div class="tab-pill-group">
            <button class="pill active" id="btn-group-matchup">Matchups</button>
            <button class="pill" id="btn-group-franchise">Franchises</button>
            <button class="pill" id="btn-group-players">Players</button>
          </div>

          <div class="filters-row">
            <select id="super-league-select" class="select-input">
              <option value="">Select League</option>
            </select>
            <select id="filter-year" class="select-input">
              <option value="">All Seasons</option>
            </select>
            <select id="filter-week" class="select-input">
              <option value="">All Weeks</option>
            </select>
            <select id="filter-franchise" class="select-input">
              <option value="">All Franchises</option>
            </select>
            <input type="text" id="filter-search-input" class="search-input" placeholder="Search..." />
          </div>
        </div>

        <!-- Data Table -->
        <div class="table-container">
          <table class="data-table" id="history-table">
            <thead id="history-table-headers">
              <tr>
                <th>Season</th>
                <th>Week</th>
                <th>Platform</th>
                <th>Team A</th>
                <th>Score</th>
                <th>Score</th>
                <th>Team B</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody id="history-table-body">
              <tr>
                <td colspan="8" class="empty-state">No leagues imported yet. Use the Import tab to import your league.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="table-meta" id="history-record-count">0 records</div>
      </section>

      <!-- 2. Live Scoreboards View -->
      <section id="tab-live" class="view-panel">
        <div class="live-grid" id="live-scoreboards-container">
          <div class="empty-state">No live matchups active. Scores will update here automatically during game days.</div>
        </div>
        <div class="ticker-box" id="live-ticker-container" style="display: none;">
          <div class="ticker-header">Live Updates</div>
          <div class="ticker-list" id="live-ticker-feed"></div>
        </div>
      </section>

      <!-- 3. Import View -->
      <section id="tab-import" class="view-panel">
        <div class="import-columns">
          <!-- ESPN Import -->
          <div class="import-pane">
            <h2 class="pane-title">ESPN Fantasy</h2>
            <form id="espn-import-form">
              <div class="input-field">
                <label for="espn-league-id">League ID</label>
                <input type="text" id="espn-league-id" class="text-input" placeholder="e.g. 12345678" required />
              </div>
              <div class="input-row">
                <div class="input-field">
                  <label for="espn-season">Season</label>
                  <input type="number" id="espn-season" class="text-input" value="2024" min="2000" max="2030" />
                </div>
                <div class="input-field">
                  <label for="espn-sport">Sport</label>
                  <select id="espn-sport" class="select-input">
                    <option value="ffl">NFL</option>
                    <option value="flb">Baseball</option>
                    <option value="fba">Basketball</option>
                  </select>
                </div>
              </div>
              <div class="input-field">
                <label for="espn-swid">SWID (Private Leagues)</label>
                <input type="text" id="espn-swid" class="text-input font-mono" placeholder="{XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX}" />
              </div>
              <div class="input-field">
                <label for="espn-s2">espn_s2 (Private Leagues)</label>
                <textarea id="espn-s2" class="text-input font-mono" rows="2" placeholder="Cookie string"></textarea>
              </div>
              <button type="submit" class="action-btn" id="btn-submit-espn">Import ESPN</button>
            </form>
          </div>

          <!-- Sleeper Import -->
          <div class="import-pane">
            <h2 class="pane-title">Sleeper</h2>
            <form id="sleeper-import-form">
              <div class="input-field">
                <label for="sleeper-league-id">League ID</label>
                <input type="text" id="sleeper-league-id" class="text-input" placeholder="e.g. 104838491823901" required />
              </div>
              <div class="input-field">
                <label for="sleeper-super-league">League Name (Optional)</label>
                <input type="text" id="sleeper-super-league" class="text-input" placeholder="My Fantasy League" />
              </div>
              <button type="submit" class="action-btn" id="btn-submit-sleeper">Import Sleeper</button>
            </form>
          </div>
        </div>

        <div id="import-notification" class="alert-bar" style="display: none;"></div>
      </section>
    </main>
  </div>

  <script src="./api.js"></script>
  <script src="./websocket.js"></script>
</body>
</html>
