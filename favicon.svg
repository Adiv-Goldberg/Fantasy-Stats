<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="footballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b3541e"/>
      <stop offset="100%" stop-color="#692807"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" />
  <circle cx="50" cy="50" r="46" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3, 3" />
  <!-- Football shape -->
  <g transform="rotate(-35 50 50)" filter="url(#shadow)">
    <path d="M 18,50 C 18,24 82,24 82,50 C 82,76 18,76 18,50 Z" fill="url(#footballGrad)" stroke="#f8fafc" stroke-width="1.5" />
    <!-- White end rings -->
    <path d="M 28,34 C 32,44 32,56 28,66" fill="none" stroke="#f8fafc" stroke-width="2.5" />
    <path d="M 72,34 C 68,44 68,56 72,66" fill="none" stroke="#f8fafc" stroke-width="2.5" />
    <!-- Laces -->
    <line x1="38" y1="50" x2="62" y2="50" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <line x1="43" y1="44" x2="43" y2="56" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" />
    <line x1="50" y1="43" x2="50" y2="57" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" />
    <line x1="57" y1="44" x2="57" y2="56" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>

